name: CI Build & Test

on:
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'OdfKit.Tests/**'
      - 'tests/OdfKit.WebFont*/**'
      - 'samples/WebFonts.*/**'
      - 'eng/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'OdfKit.Tests/**'
      - 'tests/OdfKit.WebFont*/**'
      - 'samples/WebFonts.*/**'
      - 'eng/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 靜態可維護性閘門：不依賴完整測試矩陣，失敗可快速回饋（業界 CI 慣例：fail-fast gates）。
  maintainability:
    name: Maintainability gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      - name: Merge conflict markers
        shell: pwsh
        run: ./eng/Test-MergeConflictMarkers.ps1

      - name: Environment variable isolation
        shell: pwsh
        run: ./eng/Test-EnvironmentVariableIsolation.ps1

      - name: One-line XML summary ban
        shell: pwsh
        run: ./eng/Test-OneLineXmlSummary.ps1 -FailOnIssues

      - name: Markdown local links
        shell: pwsh
        run: ./eng/Test-MarkdownLinks.ps1

      - name: XML reader security settings
        shell: pwsh
        run: ./eng/Test-XmlReaderSecurity.ps1

      - name: Performance budget contract
        shell: pwsh
        run: |
          ./eng/Test-PerformanceBudgets.ps1 -SamplePath eng/testdata/performance-sample.schema-v2.json
          ./eng/New-PerformanceBudgetCandidate.ps1 `
            -SamplePath @(
              'eng/testdata/performance-sample.schema-v2.json',
              'eng/testdata/performance-sample-2.schema-v2.json',
              'eng/testdata/performance-sample-3.schema-v2.json'
            ) `
            -OutputPath artifacts/performance/performance-budget-candidate.test.json
          ./eng/Test-PerformanceBudgets.ps1 `
            -CandidatePath artifacts/performance/performance-budget-candidate.test.json
          ./eng/Test-PerformanceBudgets.ps1 `
            -BudgetPath eng/testdata/performance-budgets.active.json `
            -SamplePath eng/testdata/performance-sample-2.schema-v2.json
          ./eng/Test-PerformanceBudgets.ps1 `
            -BudgetPath eng/testdata/performance-budgets.active-advisory.json `
            -SamplePath eng/testdata/performance-sample-3.schema-v2.json
          try {
            ./eng/Test-PerformanceBudgets.ps1 `
              -BudgetPath eng/testdata/performance-budgets.active.json `
              -SamplePath eng/testdata/performance-sample-3.schema-v2.json
            throw '未拒絕配置量回歸。'
          }
          catch {
            if ($_.Exception.Message -notlike '*配置量回歸*') { throw }
          }

      - name: Localizer key parity (12 cultures)
        shell: pwsh
        run: ./eng/Test-LocalizerKeyParity.ps1 -FailOnIssues

      - name: Localizer JSON ↔ C# consistency
        shell: pwsh
        run: ./eng/Generate-LocalizerExceptionsFromJson.ps1 -VerifyOnly

      - name: PublicApi analyzers (OdfKit dual TFM)
        shell: pwsh
        env:
          CI: true
        run: |
          # 驗證 RS0016/RS0017 基線與雙 TFM 建置在 TreatWarningsAsErrors 下通過。
          dotnet build OdfKit/OdfKit.csproj -c Release --nologo /p:RunAnalyzersDuringBuild=true

  webfont-validation:
    name: WebFont packages and browser assets
    needs: maintainability
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      - name: Unit and host tests
        shell: pwsh
        run: |
          ./eng/Test-PlaywrightFirefoxShortcutPolicy.ps1
          dotnet test tests/OdfKit.WebFonts.Tests/OdfKit.WebFonts.Tests.csproj -c Release -f net10.0
          dotnet run --project tests/OdfKit.WebFonts.SystemWebSmoke/OdfKit.WebFonts.SystemWebSmoke.csproj -c Release
          dotnet build samples/WebFonts.AspNetCore/OdfKit.WebFonts.AspNetCore.Sample.csproj -c Release

      - name: Real international fonts and HTTP assets
        shell: pwsh
        run: |
          $mappingRoot = ./eng/Install-Cns11643MappingTables.ps1 `
            -DestinationRoot artifacts/cns11643
          ./eng/Test-WebFontSmoke.ps1 `
            -PythonPath python `
            -MappingTablesRoot $mappingRoot `
            -RunBrowser

      - name: Upload WebFont browser proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webfont-browser-proof
          path: artifacts/webfont-smoke/playwright-international-*.png
          if-no-files-found: warn

  full-regression:
    name: Full regression (${{ matrix.framework }})
    needs: maintainability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Run complete test suite
        shell: pwsh
        run: |
          $resultsDir = 'artifacts/test-results/full-${{ matrix.framework }}'
          dotnet build OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }}

          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --no-restore `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=full-${{ matrix.framework }}.trx" `
            --blame-hang `
            --blame-hang-timeout 10m `
            --blame-hang-dump-type none

      - name: Upload full regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-regression-${{ matrix.framework }}
          path: artifacts/test-results/full-${{ matrix.framework }}/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.framework }})
    needs: maintainability
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    timeout-minutes: 25
    env:
      TEST_RESULTS_DIR: artifacts/test-results/${{ matrix.os }}-${{ matrix.framework }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Build test project
        shell: pwsh
        timeout-minutes: 8
        run: |
          dotnet build OdfKit.Tests/OdfKit.Tests.csproj -c Release -f ${{ matrix.framework }}

      - name: Run smoke tests (docs)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&FullyQualifiedName~DocsAndCorpusContractTests'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'docs'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-docs-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (api)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&(FullyQualifiedName~ApiUsabilityTests|FullyQualifiedName~DocumentKindApiUsabilityTests|FullyQualifiedName~TextApiUsabilityTests|FullyQualifiedName~SpreadsheetApiUsabilityTests|FullyQualifiedName~PresentationApiUsabilityTests|FullyQualifiedName~DrawingApiUsabilityTests)'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'api'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-api-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (package-entries)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&(FullyQualifiedName~OdfPackage|FullyQualifiedName~PackageReadinessTests)'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'package-entries'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-package-entries-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (package-roundtrip-core)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $testFilter = 'Category=Smoke&FullyQualifiedName~TestFlatXmlAndZipPackageCoreDocumentRoundTrip'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'package-roundtrip-core'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 8m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-package-roundtrip-core-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (package-roundtrip-embedded)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $testFilter = 'Category=Smoke&(FullyQualifiedName~TestFlatXmlAndZipPackageImageRoundTrip|FullyQualifiedName~TestFlatXmlAndZipPackageFormulaRoundTrip)'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'package-roundtrip-embedded'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 8m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-package-roundtrip-embedded-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (package-roundtrip-preservation)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $testFilter = 'Category=Smoke&(FullyQualifiedName~WriteEntryInfersManifestMediaTypesWhenMediaTypeIsOmitted|FullyQualifiedName~HighLevelSavePreservesUnknownXmlForeignContentAndProcessingInstructions)'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'package-roundtrip-preservation'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 8m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-package-roundtrip-preservation-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (vertical-slice)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&FullyQualifiedName~VerticalSliceRoundTripTests'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'vertical-slice'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-vertical-slice-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (core-security)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&(FullyQualifiedName~OdfCoreRegressionTests|FullyQualifiedName~OdfBoundaryRegressionTests|FullyQualifiedName~OdfSecurityBoundaryTests|FullyQualifiedName~SecurityBoundaryTests)'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'core-security'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-core-security-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts/test-results/${{ matrix.os }}-${{ matrix.framework }}/
          if-no-files-found: ignore
          retention-days: 7
