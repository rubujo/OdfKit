name: CI Build & Test

on:
  push:
    branches:
      - main
    # OdfKit.Tests.csproj 除了 OdfKit 本體外，還 ProjectReference 了
    # tools/OdfKit.Cli、tools/OdfSchemaGenerator 與 tests/OdfKit.PerformanceFixtures。
    # OdfKit.Benchmarks 與 samples/OdfKit.HighLevelApi 雖未被測試專案參照，
    # 但分別是 OdfKit 的效能基準與官方高階 API 範例，改壞了不該無聲息通過。
    # 這些路徑目前只在 ci.yml 缺席（odf-corpus.yml／odf-external-baseline.yml／
    # typed-dom-coverage.yml 已涵蓋 tools/OdfKit.Cli 與 tools/OdfSchemaGenerator，
    # 但那三個工作流程跑的是 corpus／DOM coverage，不會執行 CliTests 等單元測試）。
    # 補上後會與既有的 docs/**、README.md 等路徑一樣，觸發整個 workflow（含
    # webfont-validation），而不是只觸發 full-regression／test。GitHub Actions 的
    # path filter 是 workflow 層級，無法只讓單一 job 生效；要做到 job 級別範圍
    # 需要額外的 paths-filter action 判斷後再決定是否執行各 job，這超出本次
    # 「只改 ci.yml」的範圍，故維持現有「整個 workflow 一起觸發」的既有慣例，
    # 不引入新機制。
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'OdfKit.Tests/**'
      - 'OdfKit.Benchmarks/**'
      - 'tools/OdfKit.Cli/**'
      - 'tools/OdfSchemaGenerator/**'
      - 'tests/OdfKit.WebFont*/**'
      - 'tests/OdfKit.PerformanceFixtures/**'
      - 'samples/WebFonts.*/**'
      - 'samples/OdfKit.HighLevelApi/**'
      - 'eng/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/actions/cache-odfkit/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'OdfKit.Tests/**'
      - 'OdfKit.Benchmarks/**'
      - 'tools/OdfKit.Cli/**'
      - 'tools/OdfSchemaGenerator/**'
      - 'tests/OdfKit.WebFont*/**'
      - 'tests/OdfKit.PerformanceFixtures/**'
      - 'samples/WebFonts.*/**'
      - 'samples/OdfKit.HighLevelApi/**'
      - 'eng/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/actions/cache-odfkit/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 靜態可維護性閘門：不依賴完整測試矩陣，失敗可快速回饋（業界 CI 慣例：fail-fast gates）。
  maintainability:
    name: Maintainability gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      - name: Merge conflict markers
        shell: pwsh
        run: ./eng/Test-MergeConflictMarkers.ps1

      - name: Environment variable isolation
        shell: pwsh
        run: ./eng/Test-EnvironmentVariableIsolation.ps1

      - name: ProjectReference build race safety
        shell: pwsh
        run: ./eng/Test-ProjectReferenceRaceSafety.ps1

      - name: One-line XML summary ban
        shell: pwsh
        run: ./eng/Test-OneLineXmlSummary.ps1 -FailOnIssues

      - name: Bilingual XML documentation
        shell: pwsh
        run: ./eng/Test-BilingualXmlDocs.ps1 -FailOnNewIssues

      - name: Markdown local links
        shell: pwsh
        run: ./eng/Test-MarkdownLinks.ps1

      - name: XML reader security settings
        shell: pwsh
        run: ./eng/Test-XmlReaderSecurity.ps1

      - name: Reject empty catch blocks
        shell: pwsh
        run: ./eng/Test-NoEmptyCatch.ps1

      - name: Performance budget contract
        shell: pwsh
        run: |
          ./eng/Test-PerformanceBudgets.ps1 -SamplePath eng/testdata/performance-sample.schema-v2.json
          ./eng/New-PerformanceBudgetCandidate.ps1 `
            -SamplePath @(
              'eng/testdata/performance-sample.schema-v2.json',
              'eng/testdata/performance-sample-2.schema-v2.json',
              'eng/testdata/performance-sample-3.schema-v2.json'
            ) `
            -OutputPath artifacts/performance/performance-budget-candidate.test.json
          ./eng/Test-PerformanceBudgets.ps1 `
            -CandidatePath artifacts/performance/performance-budget-candidate.test.json
          ./eng/Test-PerformanceBudgets.ps1 `
            -BudgetPath eng/testdata/performance-budgets.active.json `
            -SamplePath eng/testdata/performance-sample-2.schema-v2.json
          ./eng/Test-PerformanceBudgets.ps1 `
            -BudgetPath eng/testdata/performance-budgets.active-advisory.json `
            -SamplePath eng/testdata/performance-sample-3.schema-v2.json
          try {
            ./eng/Test-PerformanceBudgets.ps1 `
              -BudgetPath eng/testdata/performance-budgets.active.json `
              -SamplePath eng/testdata/performance-sample-3.schema-v2.json
            throw '未拒絕配置量回歸。'
          }
          catch {
            if ($_.Exception.Message -notlike '*配置量回歸*') { throw }
          }

      - name: CI resource and cache policy
        shell: pwsh
        run: ./eng/Test-CiResourcePolicy.ps1

      - name: Localizer key parity (17 cultures)
        shell: pwsh
        run: ./eng/Test-LocalizerKeyParity.ps1 -FailOnIssues

      - name: Localizer JSON ↔ C# consistency
        shell: pwsh
        run: ./eng/Generate-LocalizerExceptionsFromJson.ps1 -VerifyOnly

      - name: PublicApi analyzers (OdfKit dual TFM)
        shell: pwsh
        env:
          CI: true
        run: |
          # 驗證 RS0016/RS0017 基線與雙 TFM 建置在 TreatWarningsAsErrors 下通過。
          dotnet build OdfKit/OdfKit.csproj -c Release --nologo /p:RunAnalyzersDuringBuild=true

  webfont-validation:
    name: WebFont packages and browser assets
    needs: maintainability
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      - name: Unit and host tests
        shell: pwsh
        run: |
          ./eng/Test-PlaywrightFirefoxShortcutPolicy.ps1
          dotnet test tests/OdfKit.WebFonts.Tests/OdfKit.WebFonts.Tests.csproj -c Release -f net10.0
          dotnet run --project tests/OdfKit.WebFonts.SystemWebSmoke/OdfKit.WebFonts.SystemWebSmoke.csproj -c Release
          dotnet build samples/WebFonts.AspNetCore/OdfKit.WebFonts.AspNetCore.Sample.csproj -c Release

      - name: Resolve locked CNS font source
        id: cns-font-source
        shell: pwsh
        run: |
          $tools = Get-Content eng/external-tools.json -Raw | ConvertFrom-Json
          $fonts = $tools.webFontSmoke.internationalFonts
          "sung_revision=$($fonts.cnsExtB.cacheRevision)" >> $env:GITHUB_OUTPUT
          "sung_sha256=$($fonts.cnsExtB.archiveSha256)" >> $env:GITHUB_OUTPUT
          "kai_revision=$($fonts.cnsKaiExtB.cacheRevision)" >> $env:GITHUB_OUTPUT
          "kai_sha256=$($fonts.cnsKaiExtB.archiveSha256)" >> $env:GITHUB_OUTPUT
          $nameCff = $tools.webFontNameCffCorpus
          "name_cff_revision=$($nameCff.cacheRevision)" >> $env:GITHUB_OUTPUT
          "name_cff_sha256=$($nameCff.archiveSha256)" >> $env:GITHUB_OUTPUT
          # 各 cache path 分開指紋化：先前把 mapping tables、字型與 WOFF2 corpus
          # 合成單一 key，任何一項 metadata 異動都會讓整包（數百 MB）重新存一份，
          # 在 10 GB 的 cache 配額下消耗過快。改為每個 path 只受自身 metadata 影響。
          function Get-Fingerprint([object]$Value) {
            $json = $Value | ConvertTo-Json -Depth 20 -Compress
            $hash = [Security.Cryptography.SHA256]::HashData(
              [Text.Encoding]::UTF8.GetBytes($json))
            return [Convert]::ToHexString($hash).ToLowerInvariant()
          }
          "mapping_fingerprint=$(Get-Fingerprint $tools.cns11643MappingTables)" >> $env:GITHUB_OUTPUT
          "fonts_fingerprint=$(Get-Fingerprint ([ordered]@{
            primaryFont = $tools.webFontSmoke.font
            internationalFonts = $fonts
          }))" >> $env:GITHUB_OUTPUT
          "woff2_fingerprint=$(Get-Fingerprint $tools.webFontWoff2Corpus)" >> $env:GITHUB_OUTPUT

      - name: Restore locked CNS font source
        uses: ./.github/actions/cache-odfkit
        with:
          path: artifacts/webfont-source-cache
          key: webfont-cns-${{ runner.os }}-sung-r${{ steps.cns-font-source.outputs.sung_revision }}-${{ steps.cns-font-source.outputs.sung_sha256 }}-kai-r${{ steps.cns-font-source.outputs.kai_revision }}-${{ steps.cns-font-source.outputs.kai_sha256 }}

      # 三個 corpus 分開快取，各自只受自身鎖定 metadata 影響。合併成單一 key 時，
      # 換掉一支 200 KB 的 color 字型也會讓整包數百 MB 重新存一份。
      - name: Restore locked CNS mapping tables
        uses: ./.github/actions/cache-odfkit
        with:
          path: artifacts/cns11643
          key: webfont-cns-mapping-${{ runner.os }}-${{ steps.cns-font-source.outputs.mapping_fingerprint }}

      - name: Restore locked international font corpus
        uses: ./.github/actions/cache-odfkit
        with:
          path: artifacts/webfont-format-matrix/sources
          key: webfont-fonts-${{ runner.os }}-${{ steps.cns-font-source.outputs.fonts_fingerprint }}

      - name: Restore locked WOFF2 corpus
        uses: ./.github/actions/cache-odfkit
        with:
          path: artifacts/webfont-woff2-corpus/sources
          key: webfont-woff2-corpus-${{ runner.os }}-${{ steps.cns-font-source.outputs.woff2_fingerprint }}

      - name: Restore locked name-keyed CFF corpus
        uses: ./.github/actions/cache-odfkit
        with:
          path: artifacts/webfont-name-cff-source-cache
          key: webfont-name-cff-${{ runner.os }}-r${{ steps.cns-font-source.outputs.name_cff_revision }}-${{ steps.cns-font-source.outputs.name_cff_sha256 }}

      - name: Prepare locked CNS mapping
        id: cns-mapping
        shell: pwsh
        timeout-minutes: 5
        run: |
          $mappingRoot = ./eng/Install-Cns11643MappingTables.ps1 `
            -DestinationRoot artifacts/cns11643
          "mapping_root=$mappingRoot" >> $env:GITHUB_OUTPUT

      - name: Managed dynamic generation and HTTP assets
        shell: pwsh
        timeout-minutes: 35
        run: |
          ./eng/Test-WebFontSmoke.ps1 `
            -MappingTablesRoot '${{ steps.cns-mapping.outputs.mapping_root }}' `
            -CnsFontArchivePath artifacts/webfont-source-cache/Fonts_Sung.zip `
            -RunBrowser

      - name: Real international format matrix
        shell: pwsh
        timeout-minutes: 25
        run: |
          ./eng/Test-WebFontFormatMatrix.ps1 `
            -CnsFontArchivePath artifacts/webfont-source-cache/Fonts_Sung.zip `
            -CnsKaiFontArchivePath artifacts/webfont-source-cache/Fonts_Kai.zip `
            -NameCffArchivePath artifacts/webfont-name-cff-source-cache/OTF-source-code-pro-2.042R-u_1.062R-i.zip

      - name: cmap scale browser proof
        shell: pwsh
        # 本機含建置與瀏覽器安裝為 70 秒；6 分鐘對較慢的 runner 已有充足餘裕，
        # 又不會過度佔用 job 的 70 分鐘總預算。
        timeout-minutes: 6
        # 複用 format matrix 已下載並快取的同一支鎖定字型，不重複取得 corpus。
        run: |
          ./eng/Test-WebFontCmapScaleBrowserProof.ps1 `
            -SourceFontPath artifacts/webfont-format-matrix/sources/SourceHanSansTC-Regular.otf

      - name: OTS differential oracle
        shell: pwsh
        # OTS 是 Chromium 與 Firefox 內建的字型消毒器；通過 OTS 是能在瀏覽器載入的
        # 必要條件。clean-room writer 沒有其它獨立實作可對照，這是唯一能反對我們
        # 自身判斷的自動化證據。複用 format matrix 已快取的鎖定字型。
        # 本機含 wheel 下載與 CLI 建置為 70 秒；6 分鐘對較慢的 runner 已有餘裕。
        timeout-minutes: 6
        run: |
          ./eng/Test-WebFontOtsOracle.ps1 `
            -SourceFontPath artifacts/webfont-format-matrix/sources/SourceHanSansTC-Regular.otf

      - name: Locked transformed WOFF2 corpus
        shell: pwsh
        timeout-minutes: 5
        run: ./eng/Test-WebFontWoff2Corpus.ps1

      - name: Complex shaping browser differential
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./eng/Test-WebFontLayoutBrowserSmoke.ps1

      - name: System.Web and package consumers
        shell: pwsh
        timeout-minutes: 10
        run: |
          dotnet run --project tests/OdfKit.WebFonts.SystemWebSmoke/OdfKit.WebFonts.SystemWebSmoke.csproj `
            -c Release -- `
            --font artifacts/webfont-format-matrix/sources/Fonts_Sung/TW-Sung-Ext-B-98_1.ttf `
            --sha256 eb3f27d9c58e05d23a292e59371fb6afb8d9c5da28d592b18671f1f28d7c8583
          dotnet run --project tests/OdfKit.WebFonts.SystemWebSmoke/OdfKit.WebFonts.SystemWebSmoke.csproj `
            -c Release -- `
            --font artifacts/webfont-format-matrix/sources/SourceHanSansTW-VF.otf `
            --sha256 e66bca1da93f068521f3ab10dc7fa0c6691a37c64a0ccfdb6bb3a2ee879deb77 `
            --text "繁體字 香港邨裏" `
            --postscript
          ./eng/Test-WebFontIisExpressSmoke.ps1 `
            -NoBuild `
            -Pipeline Integrated `
            -Destination artifacts/webfont-iis-express-integrated-smoke `
            -FontPath artifacts/webfont-format-matrix/sources/Fonts_Sung/TW-Sung-Ext-B-98_1.ttf `
            -SourceSha256 eb3f27d9c58e05d23a292e59371fb6afb8d9c5da28d592b18671f1f28d7c8583
          ./eng/Test-WebFontIisExpressSmoke.ps1 `
            -NoBuild `
            -Pipeline Classic `
            -Destination artifacts/webfont-iis-express-classic-smoke `
            -FontPath artifacts/webfont-format-matrix/sources/Fonts_Sung/TW-Sung-Ext-B-98_1.ttf `
            -SourceSha256 eb3f27d9c58e05d23a292e59371fb6afb8d9c5da28d592b18671f1f28d7c8583
          ./eng/Test-WebFontAspNetCoreIisExpressSmoke.ps1 `
            -NoBuild `
            -FontPath artifacts/webfont-format-matrix/sources/Fonts_Sung/TW-Sung-Ext-B-98_1.ttf `
            -SourceSha256 eb3f27d9c58e05d23a292e59371fb6afb8d9c5da28d592b18671f1f28d7c8583
          ./eng/Test-WebFontPackageConsumer.ps1 `
            -FontPath artifacts/webfont-format-matrix/sources/Fonts_Sung/TW-Sung-Ext-B-98_1.ttf `
            -SourceSha256 eb3f27d9c58e05d23a292e59371fb6afb8d9c5da28d592b18671f1f28d7c8583 `
            -Cff2FontPath artifacts/webfont-format-matrix/sources/SourceHanSansTW-VF.otf `
            -Cff2SourceSha256 e66bca1da93f068521f3ab10dc7fa0c6691a37c64a0ccfdb6bb3a2ee879deb77

      - name: Upload WebFont real evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webfont-real-evidence
          path: |
            artifacts/webfont-smoke/playwright-managed-*.png
            artifacts/webfont-format-matrix/evidence/format-matrix.json
            artifacts/webfont-woff2-corpus/evidence/**
            artifacts/webfont-layout-browser/layout-*.json
            artifacts/webfont-layout-browser/layout-*.png
            artifacts/cmap-scale-proof/evidence/cmap-scale-browser-proof.json
            artifacts/cmap-scale-proof/evidence/*.png
            artifacts/webfont-ots-oracle/evidence/ots-oracle.json
            artifacts/webfont-package-consumer/**/webfonts.json
            artifacts/webfont-iis-express-*-smoke/evidence.json
            artifacts/webfont-iis-express-*-smoke/iisexpress.*.log
            artifacts/webfont-aspnetcore-iis-express-smoke/evidence.json
            artifacts/webfont-aspnetcore-iis-express-smoke/**/iisexpress.*.log
            artifacts/webfont-worker-process-smoke/**
          if-no-files-found: warn
          retention-days: 7

  full-regression:
    name: Full regression (${{ matrix.framework }})
    needs: maintainability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Run complete test suite
        shell: pwsh
        run: |
          $resultsDir = 'artifacts/test-results/full-${{ matrix.framework }}'
          dotnet build OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }}

          # coverlet.collector 10.0.1 已由 OdfKit.Tests.csproj PackageReference 帶入，
          # --collect 只是啟用它作為 VSTest data collector，不需要額外還原或建置，
          # 與既有的 --no-build --no-restore 相容。
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --no-restore `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=full-${{ matrix.framework }}.trx" `
            --collect:"XPlat Code Coverage" `
            --blame-hang `
            --blame-hang-timeout 10m `
            --blame-hang-dump-type none

      - name: Upload full regression diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-regression-${{ matrix.framework }}
          path: artifacts/test-results/full-${{ matrix.framework }}/
          if-no-files-found: ignore
          retention-days: 7

      # 2026-07-26 成功 main 基線：net8.0 line 88.82% / branch 57.17%，
      # net10.0 line 88.80% / branch 57.17%。門檻保留小幅 runner 漂移空間，
      # 並由兩個 TFM 各自 fail closed；不能以另一個 TFM 的較高數值抵銷退化。
      - name: Enforce code coverage baseline
        shell: pwsh
        run: ./eng/Test-CodeCoverage.ps1 -SearchRoot 'artifacts/test-results/full-${{ matrix.framework }}'

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage-full-${{ matrix.framework }}
          path: artifacts/test-results/full-${{ matrix.framework }}/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.framework }})
    needs: maintainability
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 已由 full-regression 跑完整測試；此矩陣只保留 Windows
        # smoke，避免在 Ubuntu 重複執行同一批子集。
        os: [windows-latest]
        framework: [net8.0, net10.0]
    timeout-minutes: 25
    env:
      TEST_RESULTS_DIR: artifacts/test-results/${{ matrix.os }}-${{ matrix.framework }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Build test project
        shell: pwsh
        timeout-minutes: 8
        run: |
          dotnet build OdfKit.Tests/OdfKit.Tests.csproj -c Release -f ${{ matrix.framework }}

      - name: Run smoke tests (docs)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&FullyQualifiedName~DocsAndCorpusContractTests'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'docs'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-docs-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (api)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&(FullyQualifiedName~ApiUsabilityTests|FullyQualifiedName~DocumentKindApiUsabilityTests|FullyQualifiedName~TextApiUsabilityTests|FullyQualifiedName~SpreadsheetApiUsabilityTests|FullyQualifiedName~PresentationApiUsabilityTests|FullyQualifiedName~DrawingApiUsabilityTests)'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'api'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
            --no-build `
            --filter $testFilter `
            --results-directory $resultsDir `
            --logger "console;verbosity=normal" `
            --blame-hang `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type none `
            --logger "trx;LogFileName=smoke-api-${{ matrix.os }}-${{ matrix.framework }}.trx"

      - name: Run smoke tests (package-entries)
        shell: pwsh
        timeout-minutes: 8
        run: |
          $testFilter = 'Category=Smoke&(FullyQualifiedName~OdfPackage|FullyQualifiedName~PackageReadinessTests)'
          $resultsDir = Join-Path $env:TEST_RESULTS_DIR 'package-entries'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
          Write-Host "CI 快速回歸測試 filter: $testFilter"
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            -c Release `
            -f ${{ matrix.framework }} `
