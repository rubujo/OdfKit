name: NuGet pack

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'eng/OdfKit.Package.props'
      - 'eng/Get-PackageVersion.ps1'
      - 'eng/Pack-NuGet.ps1'
      - 'eng/Test-NuGetPack.ps1'
      - 'eng/Test-NetFramework48Smoke.ps1'
      - 'tests/OdfKit.NetFramework48Smoke/**'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/nuget-pack.yml'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'eng/OdfKit.Package.props'
      - 'eng/Get-PackageVersion.ps1'
      - 'eng/Pack-NuGet.ps1'
      - 'eng/Test-NuGetPack.ps1'
      - 'eng/Test-NetFramework48Smoke.ps1'
      - 'tests/OdfKit.NetFramework48Smoke/**'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/nuget-pack.yml'
  workflow_dispatch:

concurrency:
  group: nuget-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack-contract:
    name: Pack and validate package contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Pack and validate NuGet contract
        shell: pwsh
        run: |
          ./eng/Test-NuGetPack.ps1 `
            -Configuration Release `
            -SkipConsumerSmoke `
            -GenerateHashManifest

      - name: Upload immutable NuGet snapshot
        uses: actions/upload-artifact@v7
        with:
          name: odfkit-nuget-${{ github.sha }}
          path: artifacts/nuget/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate-nuget-consumers:
    name: Validate consumer (${{ matrix.name }})
    needs: pack-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            net48: false
          - name: Windows x64
            runner: windows-latest
            net48: true
          - name: Windows ARM64
            runner: windows-11-arm
            net48: false
          - name: macOS ARM64
            runner: macos-15
            net48: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Download NuGet snapshot
        uses: actions/download-artifact@v8
        with:
          name: odfkit-nuget-${{ github.sha }}
          path: artifacts/nuget

      - name: Verify snapshot and run native consumer smoke
        shell: pwsh
        run: |
          $parameters = @{
            Configuration = 'Release'
            SkipPack = $true
            VerifyHashManifest = $true
          }
          if ('${{ matrix.net48 }}' -ne 'true') {
            $parameters.SkipNetFrameworkSmoke = $true
          }
          ./eng/Test-NuGetPack.ps1 @parameters
