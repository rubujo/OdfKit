name: NuGet pack

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'tests/OdfKit.WebFonts.SystemWebSmoke/**'
      - 'eng/OdfKit.Package.props'
      - 'eng/OdfKit.WebFonts.Package.props'
      - 'eng/Get-PackageVersion.ps1'
      - 'eng/Pack-NuGet.ps1'
      - 'eng/Test-NuGetPack.ps1'
      - 'eng/Test-WebFontSupplyChain.ps1'
      - 'eng/Test-WebFontReleaseRehearsal.ps1'
      - 'eng/webfont-dependency-policy.json'
      - 'eng/Test-NetFramework48Smoke.ps1'
      - 'tests/OdfKit.NetFramework48Smoke/**'
      - 'docs/webfonts-package-readme.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/nuget-pack.yml'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'tests/OdfKit.WebFonts.SystemWebSmoke/**'
      - 'eng/OdfKit.Package.props'
      - 'eng/OdfKit.WebFonts.Package.props'
      - 'eng/Get-PackageVersion.ps1'
      - 'eng/Pack-NuGet.ps1'
      - 'eng/Test-NuGetPack.ps1'
      - 'eng/Test-WebFontSupplyChain.ps1'
      - 'eng/Test-WebFontReleaseRehearsal.ps1'
      - 'eng/webfont-dependency-policy.json'
      - 'eng/Test-NetFramework48Smoke.ps1'
      - 'tests/OdfKit.NetFramework48Smoke/**'
      - 'docs/webfonts-package-readme.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/nuget-pack.yml'
  workflow_dispatch:

concurrency:
  group: nuget-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack-contract:
    name: Pack and validate package contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Pack and validate NuGet contract
        shell: pwsh
        run: |
          ./eng/Test-NuGetPack.ps1 `
            -Configuration Release `
            -SkipConsumerSmoke `
            -GenerateHashManifest

      - name: Validate WebFont supply chain and SPDX SBOM
        shell: pwsh
        run: |
          $schemaPath = 'artifacts/tools/spdx-2.3-schema.json'
          New-Item -ItemType Directory -Force (Split-Path $schemaPath) | Out-Null
          Invoke-WebRequest `
            'https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json' `
            -OutFile $schemaPath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 2 `
            -TimeoutSec 60
          $actualHash = (Get-FileHash $schemaPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b'
          if ($actualHash -ne $expectedHash) {
            throw "SPDX 2.3 schema SHA-256 mismatch: $actualHash"
          }
          ./eng/Test-WebFontSupplyChain.ps1 -SchemaPath $schemaPath

      - name: Rehearse local release feed and NuGet audit
        shell: pwsh
        run: ./eng/Test-WebFontReleaseRehearsal.ps1

      - name: Upload immutable NuGet snapshot
        uses: actions/upload-artifact@v7
        with:
          name: odfkit-nuget-${{ github.sha }}
          path: artifacts/nuget/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload WebFont SPDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: odfkit-webfont-sbom-${{ github.sha }}
          path: |
            artifacts/webfont-sbom/manifest.spdx.json
            artifacts/webfont-release-rehearsal/evidence.json
          if-no-files-found: error
          retention-days: 1

  validate-nuget-consumers:
    name: Validate consumer (${{ matrix.name }})
    needs: pack-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            net48: false
          - name: Windows x64
            runner: windows-latest
            net48: true
          - name: Windows ARM64
            runner: windows-11-arm
            net48: false
          - name: macOS ARM64
            runner: macos-15
            net48: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Download NuGet snapshot
        uses: actions/download-artifact@v8
        with:
          name: odfkit-nuget-${{ github.sha }}
          path: artifacts/nuget

      - name: Download WebFont SPDX SBOM
        uses: actions/download-artifact@v8
        with:
          name: odfkit-webfont-sbom-${{ github.sha }}
          path: artifacts/webfont-sbom

      - name: Verify snapshot and run native consumer smoke
        shell: pwsh
        run: |
          $parameters = @{
            Configuration = 'Release'
            SkipPack = $true
            VerifyHashManifest = $true
          }
          if ('${{ matrix.net48 }}' -ne 'true') {
            $parameters.SkipNetFrameworkSmoke = $true
          }
          ./eng/Test-NuGetPack.ps1 @parameters
          ./eng/Test-WebFontSupplyChain.ps1 `
            -VerifyExisting `
            -SkipRestoreClosureValidation
