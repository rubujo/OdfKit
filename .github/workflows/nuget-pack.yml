name: NuGet pack

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'OdfKit.Tests/**'
      - 'tools/**'
      - 'tests/**'
      - 'samples/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'tests/OdfKit.WebFonts.SystemWebSmoke/**'
      - 'eng/OdfKit.Package.props'
      - 'eng/OdfKit.WebFonts.Package.props'
      - 'eng/Get-PackageVersion.ps1'
      - 'eng/Pack-NuGet.ps1'
      - 'eng/Test-NuGetPack.ps1'
      - 'eng/Test-WebFontSupplyChain.ps1'
      - 'eng/Test-WebFontReleaseRehearsal.ps1'
      - 'eng/Test-WebFontStandardsAndDependencies.ps1'
      - 'eng/Test-GitHubActionsPolicy.ps1'
      - 'eng/Test-ReleaseSbom.ps1'
      - 'eng/webfont-dependency-policy.json'
      - 'eng/webfont-standards-dependency-policy.json'
      - 'eng/Test-NetFramework48Smoke.ps1'
      - 'tests/OdfKit.NetFramework48Smoke/**'
      - 'docs/webfonts-package-readme.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/actions/cache-odfkit/**'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Extensions.*/**'
      - 'OdfKit.WebFonts.*/**'
      - 'OdfKit.Tests/**'
      - 'tools/**'
      - 'tests/**'
      - 'samples/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'tests/OdfKit.WebFonts.SystemWebSmoke/**'
      - 'eng/OdfKit.Package.props'
      - 'eng/OdfKit.WebFonts.Package.props'
      - 'eng/Get-PackageVersion.ps1'
      - 'eng/Pack-NuGet.ps1'
      - 'eng/Test-NuGetPack.ps1'
      - 'eng/Test-WebFontSupplyChain.ps1'
      - 'eng/Test-WebFontReleaseRehearsal.ps1'
      - 'eng/Test-WebFontStandardsAndDependencies.ps1'
      - 'eng/Test-GitHubActionsPolicy.ps1'
      - 'eng/Test-ReleaseSbom.ps1'
      - 'eng/webfont-dependency-policy.json'
      - 'eng/webfont-standards-dependency-policy.json'
      - 'eng/Test-NetFramework48Smoke.ps1'
      - 'tests/OdfKit.NetFramework48Smoke/**'
      - 'docs/webfonts-package-readme.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/actions/cache-odfkit/**'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: nuget-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack-contract:
    name: Pack and validate package contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-v1
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Validate current WebFont standards and stable dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/Test-WebFontStandardsAndDependencies.ps1 -Online

      - name: Pack and validate NuGet contract
        shell: pwsh
        run: |
          ./eng/Test-NuGetPack.ps1 `
            -Configuration Release `
            -SkipConsumerSmoke `
            -GenerateHashManifest

      - name: Validate WebFont and complete release SPDX SBOMs
        shell: pwsh
        run: |
          $spdx3SchemaPath = 'artifacts/tools/spdx-3.0.1-schema.json'
          $spdx23SchemaPath = 'artifacts/tools/spdx-2.3-schema.json'
          New-Item -ItemType Directory -Force (Split-Path $spdx3SchemaPath) | Out-Null
          Invoke-WebRequest `
            'https://spdx.org/schema/3.0.1/spdx-json-schema.json' `
            -OutFile $spdx3SchemaPath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 2 `
            -TimeoutSec 60
          Invoke-WebRequest `
            'https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json' `
            -OutFile $spdx23SchemaPath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 2 `
            -TimeoutSec 60
          $spdx3Hash = (Get-FileHash $spdx3SchemaPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $spdx23Hash = (Get-FileHash $spdx23SchemaPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($spdx3Hash -ne '582c64e809d5b3ef9bd0c4de13a32391b47b0284a3e8d199569fb96f649234b1') {
            throw "SPDX 3.0.1 schema SHA-256 mismatch: $spdx3Hash"
          }
          if ($spdx23Hash -ne '239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b') {
            throw "SPDX 2.3 schema SHA-256 mismatch: $spdx23Hash"
          }
          ./eng/Test-WebFontSupplyChain.ps1 -SchemaPath $spdx23SchemaPath
          ./eng/Test-ReleaseSbom.ps1 `
            -Spdx3SchemaPath $spdx3SchemaPath `
            -Spdx23SchemaPath $spdx23SchemaPath

      - name: Rehearse local release feed and NuGet audit
        shell: pwsh
        run: ./eng/Test-WebFontReleaseRehearsal.ps1

      - name: Upload immutable NuGet snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odfkit-nuget-${{ github.sha }}
          path: artifacts/nuget/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload SPDX SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odfkit-sbom-${{ github.sha }}
          path: |
            artifacts/sbom/OdfKit.spdx3.jsonld
            artifacts/sbom/OdfKit.spdx.json
            artifacts/webfont-sbom/manifest.spdx.json
            artifacts/webfont-release-rehearsal/evidence.json
          if-no-files-found: error
          retention-days: 1

  validate-nuget-consumers:
    name: Validate consumer (${{ matrix.name }})
    needs: pack-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            net48: false
          - name: Windows x64
            runner: windows-latest
            net48: true
          - name: Windows ARM64
            runner: windows-11-arm
            net48: false
          - name: macOS ARM64
            runner: macos-15
            net48: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-v1
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Download NuGet snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: odfkit-nuget-${{ github.sha }}
          path: artifacts/nuget

      - name: Download SPDX SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: odfkit-sbom-${{ github.sha }}
          path: artifacts

      - name: Verify snapshot and run native consumer smoke
        shell: pwsh
        run: |
          $parameters = @{
            Configuration = 'Release'
            SkipPack = $true
            VerifyHashManifest = $true
          }
          if ('${{ matrix.net48 }}' -ne 'true') {
            $parameters.SkipNetFrameworkSmoke = $true
          }
          ./eng/Test-NuGetPack.ps1 @parameters
          ./eng/Test-WebFontSupplyChain.ps1 `
            -VerifyExisting `
            -SkipRestoreClosureValidation
