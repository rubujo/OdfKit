name: ODF external validator baseline

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.Cli/**'
      - 'OdfKit.Tests/OdfExternalValidatorAsyncTests.cs'
      - 'OdfKit.Tests/OdfCoverageContractTests.cs'
      - 'OdfKit.Tests/OpenPgpExternalInteropTests.cs'
      - 'tests/fixtures/corpus/**'
      - 'eng/Install-OdfValidator.ps1'
      - 'eng/Install-OpfOdfValidator.ps1'
      - 'eng/Test-OpfOdfBaseline.ps1'
      - 'eng/Initialize-OasisOdfTcCorpus.ps1'
      - 'eng/Test-OdfExternalSourceContracts.ps1'
      - 'eng/Test-OdfConformanceMatrix.ps1'
      - 'eng/Build-OdfConformanceMatrix.py'
      - 'eng/Build-OdfObligationInventory.py'
      - 'eng/testdata/Test-OdfObligationInventory.py'
      - 'docs/odf-obligation-decisions.json'
      - 'docs/odf-obligation-inventory/**'
      - 'docs/odf-conformance-audits.json'
      - 'docs/odf-conformance-matrix/**'
      - 'OdfKit.Tests/OdfConformanceGapTests.cs'
      - 'docs/opf-baseline-exceptions.json'
      - 'docs/oasis-odf-tc-inventory.json'
      - 'docs/examples/oasis-odf-tc-corpus/**'
      - 'eng/Install-Jing.ps1'
      - 'eng/Install-LibreOfficeManifestSchema.ps1'
      - 'eng/Test-OdfRelaxNgBaseline.ps1'
      - 'eng/Test-WholesomeManifestBaseline.ps1'
      - 'eng/Test-OdfCorpus.ps1'
      - 'tools/OdfCorpusGenerator/**'
      - 'tools/OdfSchemaGenerator/schemas/**'
      - 'eng/external-tools.json'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/odf-external-baseline.yml'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.Cli/**'
      - 'OdfKit.Tests/OdfExternalValidatorAsyncTests.cs'
      - 'OdfKit.Tests/OdfCoverageContractTests.cs'
      - 'OdfKit.Tests/OpenPgpExternalInteropTests.cs'
      - 'tests/fixtures/corpus/**'
      - 'eng/Install-OdfValidator.ps1'
      - 'eng/Install-OpfOdfValidator.ps1'
      - 'eng/Test-OpfOdfBaseline.ps1'
      - 'eng/Initialize-OasisOdfTcCorpus.ps1'
      - 'eng/Test-OdfExternalSourceContracts.ps1'
      - 'eng/Test-OdfConformanceMatrix.ps1'
      - 'eng/Build-OdfConformanceMatrix.py'
      - 'eng/Build-OdfObligationInventory.py'
      - 'eng/testdata/Test-OdfObligationInventory.py'
      - 'docs/odf-obligation-decisions.json'
      - 'docs/odf-obligation-inventory/**'
      - 'docs/odf-conformance-audits.json'
      - 'docs/odf-conformance-matrix/**'
      - 'OdfKit.Tests/OdfConformanceGapTests.cs'
      - 'docs/opf-baseline-exceptions.json'
      - 'docs/oasis-odf-tc-inventory.json'
      - 'docs/examples/oasis-odf-tc-corpus/**'
      - 'eng/Install-Jing.ps1'
      - 'eng/Install-LibreOfficeManifestSchema.ps1'
      - 'eng/Test-OdfRelaxNgBaseline.ps1'
      - 'eng/Test-WholesomeManifestBaseline.ps1'
      - 'eng/Test-OdfCorpus.ps1'
      - 'tools/OdfCorpusGenerator/**'
      - 'tools/OdfSchemaGenerator/schemas/**'
      - 'eng/external-tools.json'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/odf-external-baseline.yml'
  workflow_dispatch:

concurrency:
  group: odf-external-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-with-odf-validator:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-v1
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Read pinned validator metadata
        id: validator
        shell: pwsh
        run: |
          $tool = (Get-Content eng/external-tools.json -Raw | ConvertFrom-Json).odfValidator
          $cacheRoot = Join-Path $env:RUNNER_TOOL_CACHE `
            "odfkit/odf-validator/$($tool.source)/r$($tool.cacheRevision)/$($tool.version)/$($tool.sha256)"
          "source=$($tool.source)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache_revision=$($tool.cacheRevision)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($tool.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$($tool.sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "java_version=$($tool.minimumJavaVersion)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache_root=$cacheRoot" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read pinned Jing metadata
        id: jing
        shell: pwsh
        run: |
          $tool = (Get-Content eng/external-tools.json -Raw | ConvertFrom-Json).jing
          $cacheRoot = Join-Path $env:RUNNER_TOOL_CACHE `
            "odfkit/jing/$($tool.source)/r$($tool.cacheRevision)/$($tool.version)/$($tool.sha256)"
          "source=$($tool.source)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache_revision=$($tool.cacheRevision)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($tool.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$($tool.sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache_root=$cacheRoot" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read pinned LibreOffice manifest schema metadata
        id: libreoffice-schema
        shell: pwsh
        run: |
          $schema = (Get-Content eng/external-tools.json -Raw | ConvertFrom-Json).libreOfficeManifestSchema
          $cacheRoot = Join-Path $env:RUNNER_TOOL_CACHE `
            "odfkit/libreoffice-manifest-schema/$($schema.source)/r$($schema.cacheRevision)/$($schema.version)/$($schema.sha256)"
          "source=$($schema.source)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache_revision=$($schema.cacheRevision)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($schema.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$($schema.sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cache_root=$cacheRoot" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.validator.outputs.java_version }}

      - name: Check external source contracts and read OPF and OASIS metadata
        id: external-sources
        shell: pwsh
        run: |
          ./eng/Test-OdfExternalSourceContracts.ps1
          ./eng/Test-OdfConformanceMatrix.ps1
          python eng/testdata/Test-OdfConformanceMatrix.py
          if ($LASTEXITCODE -ne 0) { throw 'Conformance source extraction regressions failed.' }
          python eng/testdata/Test-OdfObligationInventory.py
          if ($LASTEXITCODE -ne 0) { throw 'Obligation inventory extraction regressions failed.' }
          python eng/Build-OdfObligationInventory.py --check-contracts
          if ($LASTEXITCODE -ne 0) { throw 'Obligation inventory contracts failed.' }
          $tool = (Get-Content eng/external-tools.json -Raw | ConvertFrom-Json).opfOdfValidator
          $corpus = Get-Content docs/examples/oasis-odf-tc-corpus/manifest.json -Raw | ConvertFrom-Json
          $corpusHash = (Get-FileHash docs/examples/oasis-odf-tc-corpus/manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "opf_source=$($tool.source)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "opf_revision=$($tool.cacheRevision)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "opf_version=$($tool.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "opf_sha256=$($tool.sha256)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "opf_root=$(Join-Path $env:RUNNER_TOOL_CACHE "odfkit/opf/$($tool.source)/r$($tool.cacheRevision)/$($tool.version)/$($tool.sha256)")" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "oasis_revision=$($corpus.revision)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "oasis_sha256=$corpusHash" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "oasis_root=$(Join-Path $env:RUNNER_TOOL_CACHE "odfkit/oasis-odf-tc/r1/$($corpus.revision)/$corpusHash")" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache pinned OPF Validator
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ steps.external-sources.outputs.opf_root }}
          key: opf-validator-${{ runner.os }}-${{ steps.external-sources.outputs.opf_source }}-r${{ steps.external-sources.outputs.opf_revision }}-${{ steps.external-sources.outputs.opf_version }}-${{ steps.external-sources.outputs.opf_sha256 }}

      - name: Install and verify OPF Validator
        id: install-opf
        shell: pwsh
        run: |
          $jarPath = ./eng/Install-OpfOdfValidator.ps1 -DestinationRoot '${{ steps.external-sources.outputs.opf_root }}'
          "jar_path=$jarPath" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache pinned OASIS test documents
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ steps.external-sources.outputs.oasis_root }}
          key: oasis-odf-tc-${{ runner.os }}-r1-${{ steps.external-sources.outputs.oasis_revision }}-${{ steps.external-sources.outputs.oasis_sha256 }}

      - name: Download and verify OASIS test documents
        shell: pwsh
        run: ./eng/Initialize-OasisOdfTcCorpus.ps1 -DestinationRoot '${{ steps.external-sources.outputs.oasis_root }}'

      - name: Cache pinned ODF Validator
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ steps.validator.outputs.cache_root }}
          key: odf-validator-${{ runner.os }}-${{ steps.validator.outputs.source }}-r${{ steps.validator.outputs.cache_revision }}-${{ steps.validator.outputs.version }}-${{ steps.validator.outputs.sha256 }}

      - name: Install and verify ODF Validator
        id: install
        shell: pwsh
        run: |
          $jarPath = ./eng/Install-OdfValidator.ps1 `
            -DestinationRoot '${{ steps.validator.outputs.cache_root }}'
          "jar_path=$jarPath" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache pinned Jing
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ steps.jing.outputs.cache_root }}
          key: jing-${{ runner.os }}-${{ steps.jing.outputs.source }}-r${{ steps.jing.outputs.cache_revision }}-${{ steps.jing.outputs.version }}-${{ steps.jing.outputs.sha256 }}

      - name: Install and verify Jing
        id: install-jing
        shell: pwsh
        run: |
          $jarPath = ./eng/Install-Jing.ps1 `
            -DestinationRoot '${{ steps.jing.outputs.cache_root }}'
          "jar_path=$jarPath" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache pinned LibreOffice manifest schema
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ steps.libreoffice-schema.outputs.cache_root }}
          key: libreoffice-manifest-schema-${{ runner.os }}-${{ steps.libreoffice-schema.outputs.source }}-r${{ steps.libreoffice-schema.outputs.cache_revision }}-${{ steps.libreoffice-schema.outputs.version }}-${{ steps.libreoffice-schema.outputs.sha256 }}

      - name: Install and verify LibreOffice manifest schema
        id: install-libreoffice-schema
        shell: pwsh
        run: |
          $schemaPath = ./eng/Install-LibreOfficeManifestSchema.ps1 `
            -DestinationRoot '${{ steps.libreoffice-schema.outputs.cache_root }}'
          "schema_path=$schemaPath" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate internal ODF corpus
        id: internal-corpus
        shell: pwsh
        run: ./eng/Test-OdfCorpus.ps1

      - name: Regenerate corpus from current source
        shell: pwsh
        run: |
          dotnet run --project tools/OdfCorpusGenerator `
            --framework net10.0 `
            --configuration Release `
            --no-build `
            -- $env:GITHUB_WORKSPACE

      - name: Validate regenerated internal ODF corpus
        shell: pwsh
        run: ./eng/Test-OdfCorpus.ps1 -SkipBuild

      - name: Validate complete RELAX NG baseline with Jing
        shell: pwsh
        run: |
          ./eng/Test-OdfRelaxNgBaseline.ps1 `
            -JingJar '${{ steps.install-jing.outputs.jar_path }}'

      - name: Validate generated wholesome manifest with Jing
        shell: pwsh
        run: |
          ./eng/Test-WholesomeManifestBaseline.ps1 `
            -JingJar '${{ steps.install-jing.outputs.jar_path }}' `
            -LibreOfficeManifestSchema '${{ steps.install-libreoffice-schema.outputs.schema_path }}' `
            -NoBuild

      - name: Validate OpenPGP transport and manifest with GnuPG and Jing
        shell: pwsh
        env:
          ODFKIT_RUN_GNUPG_INTEROP: '1'
          ODFKIT_OPENPGP_OUTPUT_DIR: ${{ runner.temp }}/odfkit-openpgp
        run: |
          $gpg = (Get-Command gpg -ErrorAction Stop).Source
          $env:ODFKIT_GPG_PATH = $gpg
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-build `
            --no-restore `
            --filter 'FullyQualifiedName=OdfKit.Tests.OpenPgpExternalInteropTests.GnuPgDecryptsOdfKitSessionKeyAndPackageRoundTrips'
          java -jar '${{ steps.install-jing.outputs.jar_path }}' `
            -i '${{ steps.install-libreoffice-schema.outputs.schema_path }}' `
            "$env:ODFKIT_OPENPGP_OUTPUT_DIR/openpgp-manifest.xml"

      - name: Validate applicable ODF package parity
        shell: pwsh
        run: |
          ./eng/Test-OdfCorpus.ps1 `
            -InternalBaselineJar '${{ steps.install.outputs.jar_path }}' `
            -InternalBaselineVersions '1.0', '1.1', '1.2', '1.3', '1.4' `
            -InternalBaselineExcludedKinds 'Database', 'Formula', 'FormulaTemplate' `
            -InternalBaselinePackageOnly `
            -SkipBuild `
            -SkipInternalValidation

      - name: Validate real JAR positive and negative canaries
        if: ${{ always() && steps.install.outcome == 'success' && steps.internal-corpus.outcome == 'success' }}
        shell: pwsh
        env:
          ODFKIT_ODFVALIDATOR_JAR: ${{ steps.install.outputs.jar_path }}
        run: |
          dotnet test OdfKit.Tests/OdfKit.Tests.csproj `
            --configuration Release `
            --framework net10.0 `
            --no-build `
            --no-restore `
            --filter 'FullyQualifiedName=OdfKit.Tests.OdfExternalValidatorAsyncTests.ValidateWithOdfValidatorRealJarDetectsValidAndInvalidDocuments|FullyQualifiedName=OdfKit.Tests.OdfExternalValidatorAsyncTests.ValidateWithOdfValidatorRealJarUsesProfileConformanceMode'

      - name: Validate independent OPF baseline
        shell: pwsh
        run: |
          ./eng/Test-OpfOdfBaseline.ps1 `
            -ValidatorJar '${{ steps.install-opf.outputs.jar_path }}' `
            -RequireAllExceptions

      - name: Validate OASIS test documents with OdfKit and TDF
        shell: pwsh
        run: |
          ./eng/Test-OdfCorpus.ps1 -SkipBuild -SkipInternalValidation `
            -ExternalRoot '${{ steps.external-sources.outputs.oasis_root }}' `
            -ExternalManifest docs/examples/oasis-odf-tc-corpus/manifest.json `
            -BaselineJar '${{ steps.install.outputs.jar_path }}'

      - name: Validate OASIS test documents with OPF
        shell: pwsh
        run: |
          ./eng/Test-OpfOdfBaseline.ps1 `
            -ValidatorJar '${{ steps.install-opf.outputs.jar_path }}' `
            -Manifest docs/examples/oasis-odf-tc-corpus/manifest.json `
            -CorpusRoot '${{ steps.external-sources.outputs.oasis_root }}' `
            -ReportPath artifacts/opf-oasis-baseline.json

      - name: Upload OPF diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opf-baseline-diagnostics
          path: artifacts/opf*-baseline.json
          retention-days: 7
          if-no-files-found: ignore
