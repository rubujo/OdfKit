name: Performance benchmark

on:
  workflow_dispatch:
    inputs:
      run_webfont_iis_sustained_load:
        description: 'Run the opt-in four-path WebFont IIS sustained load'
        required: false
        default: false
        type: boolean
      run_macos_informational:
        description: 'Run the opt-in informational macOS benchmark'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: performance-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-regression:
    name: Benchmark Regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      # windows-latest／ubuntu-latest 皆為硬閘門（超過容忍度即失敗）；跨平台計時雜訊較大，
      # 容忍度沿用既有值，若日後累積數據顯示 Linux 雜訊需要更寬容忍度再個別調整。
      - name: Run benchmark regression
        shell: pwsh
        run: ./eng/Benchmark-Regression.ps1 -Configuration Release

      - name: Measure standard ODS ODT ODP workloads
        shell: pwsh
        run: ./eng/Benchmark-StandardDocuments.ps1 -Configuration Release -ArtifactName "standard-document-performance-${{ matrix.os }}"

      - name: Validate standard document measurements
        shell: pwsh
        run: ./eng/Test-PerformanceBudgets.ps1 -SamplePath artifacts/performance/standard-documents.json

      - name: Upload standard document measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standard-document-performance-${{ matrix.os }}
          path: artifacts/performance/standard-documents.json
          if-no-files-found: warn
          retention-days: 14

  benchmark-regression-macos:
    name: Benchmark Regression (macos-latest, informational)
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos_informational
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      # macOS 目前僅量測、不閘門：CI 尚無 macOS 基準線數據可比對，先以 continue-on-error 上傳
      # 量測結果，累積數據後再視情況升級為硬閘門，避免第一輪就因缺乏基準產生誤報。
      - name: Run benchmark regression (informational, non-blocking)
        shell: pwsh
        continue-on-error: true
        run: ./eng/Benchmark-Regression.ps1 -Configuration Release

      - name: Measure standard ODS ODT ODP workloads
        shell: pwsh
        continue-on-error: true
        run: ./eng/Benchmark-StandardDocuments.ps1 -Configuration Release -ArtifactName "standard-document-performance-macos-latest"

      - name: Validate standard document measurements
        shell: pwsh
        continue-on-error: true
        run: ./eng/Test-PerformanceBudgets.ps1 -SamplePath artifacts/performance/standard-documents.json

      - name: Upload standard document measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standard-document-performance-macos-latest
          path: artifacts/performance/standard-documents.json
          if-no-files-found: warn
          retention-days: 14

  webfont-iis-sustained-load:
    name: WebFont IIS sustained load (Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.run_webfont_iis_sustained_load
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      - name: Resolve locked CNS font source
        id: cns-font-source
        shell: pwsh
        run: |
          $font = (Get-Content eng/external-tools.json -Raw |
            ConvertFrom-Json).webFontSmoke.internationalFonts
          "sung_revision=$($font.cnsExtB.cacheRevision)" >> $env:GITHUB_OUTPUT
          "sung_sha256=$($font.cnsExtB.archiveSha256)" >> $env:GITHUB_OUTPUT
          "kai_revision=$($font.cnsKaiExtB.cacheRevision)" >> $env:GITHUB_OUTPUT
          "kai_sha256=$($font.cnsKaiExtB.archiveSha256)" >> $env:GITHUB_OUTPUT

      - name: Restore locked CNS font source
        uses: ./.github/actions/cache-odfkit
        with:
          path: artifacts/webfont-source-cache
          # 與 ci.yml 共用同一份宋／楷封存 cache，不為 opt-in 負載另建副本。
          key: webfont-cns-${{ runner.os }}-sung-r${{ steps.cns-font-source.outputs.sung_revision }}-${{ steps.cns-font-source.outputs.sung_sha256 }}-kai-r${{ steps.cns-font-source.outputs.kai_revision }}-${{ steps.cns-font-source.outputs.kai_sha256 }}

      - name: Run four-path IIS sustained load
        shell: pwsh
        timeout-minutes: 35
        run: |
          ./eng/Test-WebFontIisSustainedLoad.ps1 `
            -CnsFontArchivePath artifacts/webfont-source-cache/Fonts_Sung.zip `
            -MinimumDurationSeconds 30 `
            -MinimumRequestCount 4096 `
            -MaximumRequestCount 65536

      - name: Upload WebFont sustained-load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webfont-iis-sustained-load-${{ runner.os }}
          path: |
            artifacts/webfont-iis-sustained-load/evidence.json
            artifacts/webfont-iis-sustained-load/**/evidence.json
            artifacts/webfont-iis-sustained-load/**/iisexpress.*.log
          if-no-files-found: warn
          retention-days: 14
