name: CodeQL

# 這個 repo 解析大量不可信輸入（ODF／ZIP／XML／字型），是 SAST 投報率最高的場景，
# 但先前完全沒有任何 SAST 覆蓋。新增本工作流程補上 C# 的 CodeQL 靜態分析。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 每週一次的完整掃描，補齊 push／PR 觸發間可能被略過的路徑。
    - cron: '31 4 * * 4'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            # 建置模式取捨：OdfKit.csproj 明確關閉 EnableTrimAnalyzer，因為對本專案
            # 約 28.7 萬行產生碼（DOM/Generated 606 檔、Compliance/Generated 13 檔，
            # 佔 .cs 檔案 62%）做資料流分析會讓 VBCSCompiler 記憶體衝上 7GB 以上。
            # 若在此改用手動建置（`dotnet build` 43 個專案並開啟分析器），會複現
            # 同一種資源壓力，且逐一建置每個專案的 CI 成本也偏高。
            #
            # build-mode: none 自 CodeQL 2.18（2024）起以 public beta 形式支援 C#，
            # 並已於 CodeQL 2.24（2026-01）對 .NET 10 專案在 buildless 模式下正式提供
            # 完整擷取（含 traced 模式）。buildless 擷取只做原始碼解析與
            # `dotnet restore`，不會觸發 Roslyn 分析器管線，因此不會重現
            # EnableTrimAnalyzer 那種以分析器驅動、隨產生碼行數線性增加記憶體的問題。
            # 這是本 repo 現有資源限制下唯一能負擔、涵蓋全部 43 個專案的建置模式。
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-v1
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 此處刻意不設定 paths-ignore 來排除產生碼，原因有二：
          #   1) paths-ignore 不是 codeql-action/init 的合法 with 輸入。action 輸入
          #      必須是純量字串，傳入 YAML 清單會讓整個 workflow 檔無法通過 schema
          #      驗證，GitHub 直接以「workflow file issue」拒絕載入（連 job 都不會
          #      建立）。若要用，須改寫在 config 輸入的行內 YAML 或 config-file 內。
          #   2) 即使改寫到 config，paths／paths-ignore 依官方文件僅適用於
          #      Python、Ruby、JavaScript/TypeScript 等直譯語言，對 C# 這類編譯語言
          #      無效——即便採 build-mode: none 亦然。
          # 因此產生碼的雜訊改由檢視結果時過濾，而非在擷取階段排除。
          # 參考：https://docs.github.com/en/code-security/reference/code-scanning/workflow-configuration-options

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
