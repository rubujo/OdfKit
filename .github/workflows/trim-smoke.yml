name: Trim smoke validation

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.TrimSmoke/**'
      - 'OdfKit.WebFonts.Abstractions/**'
      - 'OdfKit.WebFonts.OpenType/**'
      - 'OdfKit.WebFonts.Worker/**'
      - 'OdfKit.WebFonts.Sidecar/**'
      - 'OdfKit.WebFonts.Sidecar.Server/**'
      - 'OdfKit.WebFonts.Sidecar.Host/**'
      - 'OdfKit.WebFonts.Hosting.SystemWeb/**'
      - 'tests/OdfKit.WebFonts.Sidecar.Net48Smoke/**'
      - 'tests/OdfKit.WebFonts.SystemWebSmoke/**'
      - 'eng/Test-TrimSmoke.ps1'
      - 'eng/Test-WebFontSidecarAot.ps1'
      - 'eng/Manage-WebFontSidecarService.ps1'
      - 'eng/Test-WebFontSidecarWindowsService.ps1'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/trim-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.TrimSmoke/**'
      - 'OdfKit.WebFonts.Abstractions/**'
      - 'OdfKit.WebFonts.OpenType/**'
      - 'OdfKit.WebFonts.Worker/**'
      - 'OdfKit.WebFonts.Sidecar/**'
      - 'OdfKit.WebFonts.Sidecar.Server/**'
      - 'OdfKit.WebFonts.Sidecar.Host/**'
      - 'OdfKit.WebFonts.Hosting.SystemWeb/**'
      - 'tests/OdfKit.WebFonts.Sidecar.Net48Smoke/**'
      - 'tests/OdfKit.WebFonts.SystemWebSmoke/**'
      - 'eng/Test-TrimSmoke.ps1'
      - 'eng/Test-WebFontSidecarAot.ps1'
      - 'eng/Manage-WebFontSidecarService.ps1'
      - 'eng/Test-WebFontSidecarWindowsService.ps1'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/trim-smoke.yml'
  workflow_dispatch:

concurrency:
  group: trim-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-trim-smoke:
    name: Native AOT Trim Smoke (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      - name: Run trim smoke (blocking)
        shell: pwsh
        run: ./eng/Test-TrimSmoke.ps1 -Configuration Release -PublishAot -RuntimeIdentifier ${{ matrix.rid }}

      - name: Run net48 to NativeAOT WebFont sidecar smoke
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./eng/Test-WebFontSidecarAot.ps1 -Configuration Release -RuntimeIdentifier win-x64

      - name: Run NativeAOT WebFont sidecar as a Windows Service
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: >-
          ./eng/Test-WebFontSidecarWindowsService.ps1
          -Configuration Release
          -HostExecutablePath artifacts/webfont-sidecar-aot-win-x64/OdfKit.WebFonts.Sidecar.Host.exe

      - name: Cross-publish Windows ARM64 WebFont sidecar
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./eng/Test-WebFontSidecarAot.ps1 -Configuration Release -RuntimeIdentifier win-arm64 -PublishOnly
