name: Trim smoke validation

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.TrimSmoke/**'
      - 'eng/Test-TrimSmoke.ps1'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/trim-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.TrimSmoke/**'
      - 'eng/Test-TrimSmoke.ps1'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/trim-smoke.yml'
  workflow_dispatch:

concurrency:
  group: trim-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-trim-smoke:
    name: Native AOT Trim Smoke (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x

      - name: Run trim smoke (blocking)
        shell: pwsh
        run: ./eng/Test-TrimSmoke.ps1 -Configuration Release -PublishAot -RuntimeIdentifier ${{ matrix.rid }}
