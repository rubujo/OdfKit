name: Typed DOM coverage

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.Cli/**'
      - 'tools/OdfSchemaGenerator/**'
      - 'eng/Test-OdfTypedDomCoverage.ps1'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/typed-dom-coverage.yml'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'tools/OdfKit.Cli/**'
      - 'tools/OdfSchemaGenerator/**'
      - 'eng/Test-OdfTypedDomCoverage.ps1'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/typed-dom-coverage.yml'
  workflow_dispatch:

concurrency:
  group: typed-dom-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typed-dom-coverage:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-v1
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Generate typed DOM coverage
        shell: pwsh
        run: ./eng/Test-OdfTypedDomCoverage.ps1

      - name: Upload typed DOM coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odf-typed-dom-coverage
          path: artifacts/typed-dom-coverage/odf-typed-dom-coverage.json
          retention-days: 7
