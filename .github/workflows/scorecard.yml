name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Supply-chain security analysis
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'branch_protection_rule' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # publish_results 的 workflow 驗證要求本 job 只能包含 ossf/scorecard-action 允許清單內的
      # action 步驟（actions/checkout、actions/upload-artifact、github/codeql-action/upload-sarif、
      # ossf/scorecard-action、step-security/harden-runner），不得有任何 run: 步驟。先前用
      # run: mkdir 建立 artifacts/scorecard 會讓發布驗證回 HTTP 400 並輸出警告，因此改為輸出到
      # 工作區根目錄，由 scorecard-action 自行建立檔案。
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Upload Scorecard findings to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
