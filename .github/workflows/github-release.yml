name: GitHub Release CD

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: github-release-${{ github.ref }}

permissions: read-all

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: |
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-v1
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify Tag matches Props Version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expectedVersion = $tag.TrimStart('v')
          $packageVersion = & (Join-Path "eng" "Get-PackageVersion.ps1")
          Write-Host "Git Tag: $tag"
          Write-Host "Props Version: $packageVersion"
          if ($expectedVersion -ne $packageVersion) {
              Write-Error "錯誤：Git Tag 版本 ($tag) 與 eng/OdfKit.Package.props 中的版本 ($packageVersion) 不一致！請先更新 props 檔案中的版本。"
              exit 1
          }

      - name: Run consumer smoke test & validations
        shell: pwsh
        run: ./eng/Test-NuGetPack.ps1 -Configuration Release -GenerateHashManifest

      - name: Validate supply chain and rehearse release feed
        shell: pwsh
        run: |
          $spdx3SchemaPath = 'artifacts/tools/spdx-3.0.1-schema.json'
          $spdx23SchemaPath = 'artifacts/tools/spdx-2.3-schema.json'
          New-Item -ItemType Directory -Force (Split-Path $spdx3SchemaPath) | Out-Null
          Invoke-WebRequest `
            'https://spdx.org/schema/3.0.1/spdx-json-schema.json' `
            -OutFile $spdx3SchemaPath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 2 `
            -TimeoutSec 60
          Invoke-WebRequest `
            'https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json' `
            -OutFile $spdx23SchemaPath `
            -MaximumRetryCount 3 `
            -RetryIntervalSec 2 `
            -TimeoutSec 60
          if ((Get-FileHash $spdx3SchemaPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne `
              '582c64e809d5b3ef9bd0c4de13a32391b47b0284a3e8d199569fb96f649234b1') {
            throw 'SPDX 3.0.1 schema SHA-256 mismatch.'
          }
          if ((Get-FileHash $spdx23SchemaPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne `
              '239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b') {
            throw 'SPDX 2.3 schema SHA-256 mismatch.'
          }
          ./eng/Test-WebFontSupplyChain.ps1
          ./eng/Test-ReleaseSbom.ps1 `
            -Spdx3SchemaPath $spdx3SchemaPath `
            -Spdx23SchemaPath $spdx23SchemaPath
          ./eng/Test-WebFontReleaseRehearsal.ps1
          ./eng/Publish-WebFontSidecar.ps1
          ./eng/Publish-GitHubRelease.ps1 -SkipValidation -Tag "${{ github.ref_name }}"

      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/nuget/SHA256SUMS
            artifacts/sbom/OdfKit.spdx3.jsonld
            artifacts/sbom/OdfKit.spdx.json
            artifacts/webfont-sbom/manifest.spdx.json
            artifacts/webfont-sidecar/*.zip
            artifacts/webfont-sidecar/OdfKit.WebFonts.Sidecar.Host-SHA256SUMS
            artifacts/OdfKit-nuget-packages.zip

      # GitHub artifact attestations currently verify SPDX predicates as v2.3.
      # SPDX 3.0.1 remains the primary release asset; this input is compatibility-only.
      - name: Attest complete release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts/nuget/*.nupkg
          sbom-path: artifacts/sbom/OdfKit.spdx.json

      - name: Create GitHub Release and Upload Assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./eng/Publish-GitHubRelease.ps1 `
            -CreateRelease `
            -Tag "${{ github.ref_name }}" `
            -SkipValidation `
            -UseExistingBundle
