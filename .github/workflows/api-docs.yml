name: API documentation

on:
  pull_request:
    paths: ['OdfKit/**', 'OdfKit.Extensions.*/**', 'api-docs/**', 'docs/**', 'THIRD-PARTY-NOTICES.md', 'eng/Build-ApiDocs.ps1', 'eng/Test-ApiDocsTranslations*.ps1', '.github/workflows/api-docs.yml']
  push:
    branches: [main]
    paths: ['OdfKit/**', 'OdfKit.Extensions.*/**', 'api-docs/**', 'docs/**', 'THIRD-PARTY-NOTICES.md', 'eng/Build-ApiDocs.ps1', 'eng/Test-ApiDocsTranslations*.ps1', '.github/workflows/api-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: 10.0.x
      - name: Test translation contract
        shell: pwsh
        run: ./eng/Test-ApiDocsTranslations.Tests.ps1
      - name: Build 12-locale API site
        shell: pwsh
        run: ./eng/Build-ApiDocs.ps1
      - name: Configure Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/api-site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
