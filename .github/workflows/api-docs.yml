name: API documentation

on:
  pull_request:
    paths: ['OdfKit/**', 'OdfKit.Extensions.*/**', 'OdfKit.WebFonts.*/**', 'api-docs/**', 'docs/**', 'samples/WebFonts.*/**', 'THIRD-PARTY-NOTICES.md', 'eng/Build-ApiDocs.ps1', 'eng/Test-ApiDocsTranslations*.ps1', '.github/workflows/api-docs.yml']
  push:
    branches: [main]
    paths: ['OdfKit/**', 'OdfKit.Extensions.*/**', 'OdfKit.WebFonts.*/**', 'api-docs/**', 'docs/**', 'samples/WebFonts.*/**', 'THIRD-PARTY-NOTICES.md', 'eng/Build-ApiDocs.ps1', 'eng/Test-ApiDocsTranslations*.ps1', '.github/workflows/api-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet-odfkit
        with:
          dotnet-versions: 10.0.x
      - name: Cache NuGet packages
        uses: ./.github/actions/cache-odfkit
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-v1
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Test translation contract
        shell: pwsh
        run: ./eng/Test-ApiDocsTranslations.Tests.ps1
      - name: Build 17-locale API site
        shell: pwsh
        run: ./eng/Build-ApiDocs.ps1
      - name: Configure Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/api-site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
