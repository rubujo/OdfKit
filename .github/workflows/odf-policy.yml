name: ODF policy

on:
  pull_request:
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Tests/**'
      - 'eng/Test-OdfPolicy.ps1'
      - 'eng/Test-EvidenceClaims.ps1'
      - 'eng/Test-SemanticCoverage.ps1'
      - 'docs/claims.json'
      - 'docs/semantic-coverage.json'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/odf-policy.yml'
  push:
    branches:
      - main
    paths:
      - 'OdfKit/**'
      - 'OdfKit.Tests/**'
      - 'eng/Test-OdfPolicy.ps1'
      - 'eng/Test-EvidenceClaims.ps1'
      - 'eng/Test-SemanticCoverage.ps1'
      - 'docs/claims.json'
      - 'docs/semantic-coverage.json'
      - '.github/actions/setup-dotnet-odfkit/**'
      - '.github/workflows/odf-policy.yml'
  workflow_dispatch:

concurrency:
  group: odf-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-odfkit

      - name: Run ODF policy tests
        shell: pwsh
        run: ./eng/Test-OdfPolicy.ps1

      - name: Validate evidence claims
        shell: pwsh
        run: ./eng/Test-EvidenceClaims.ps1

      - name: Validate semantic API coverage
        shell: pwsh
        run: ./eng/Test-SemanticCoverage.ps1
