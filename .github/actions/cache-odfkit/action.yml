name: Restore shared OdfKit cache
description: 在 PR 僅還原 cache，在受信任分支才允許建立一次共用 cache。
inputs:
  path:
    description: 要還原或儲存的路徑。
    required: true
  key:
    description: 穩定且版本化的主要 cache key。
    required: true
  restore-keys:
    description: 選用的 fallback key prefix。
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Restore cache without saving on pull requests
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}

    - name: Restore and save shared cache outside pull requests
      if: github.event_name != 'pull_request'
      uses: actions/cache@v6
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
